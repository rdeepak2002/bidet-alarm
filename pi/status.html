<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bidet Alarm</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bidet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6fb">
<meta name="color-scheme" content="light">
<style>
  :root {
    --bg:#f3f6fb; --fg:#16202e; --muted:#6b7686; --faint:#9aa4b2; --card:#ffffff; --line:#e7ecf3;
    --ok:#16a36a; --ok-soft:#e9f7f0; --warn:#e08a00; --warn-soft:#fdf4e2; --bad:#e0413a; --bad-soft:#fdeceb;
    --water:#4f9cf2; --water2:#86bdf7;
    --shadow:0 1px 2px rgba(22,32,46,.04), 0 8px 24px rgba(22,32,46,.06);
    --ring:min(220px, 62vw);
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
         background:radial-gradient(120% 50% at 50% -10%, #e2ecfb 0%, var(--bg) 65%) no-repeat, var(--bg); min-height:100vh;
         -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  main { max-width:520px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom)); }

  /* shown only when updates stop arriving */
  .offline { position:absolute; top:14px; right:14px; z-index:2; display:grid; place-items:center;
             width:32px; height:32px; border-radius:50%; background:#fff; color:var(--bad); font-size:13px; font-weight:600;
             box-shadow:0 1px 4px rgba(224,65,58,.2); opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .3s, transform .3s; }
  .offline svg { width:16px; height:16px; }
  .offline.show { opacity:1; transform:none; }

  .card { background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:10px 20px; margin-bottom:16px; }

  /* ---- status card ---- */
  #status { position:relative; display:flex; flex-direction:column; align-items:center; padding:28px 18px 24px; transition:background .6s ease; overflow:hidden; }
  #status.open { background:var(--warn-soft); }
  #status.alarm { background:var(--bad-soft); }
  #status.closed { background:var(--card); }
  .ring { position:relative; width:var(--ring); height:var(--ring); }
  .ring svg.arc { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
  .ring circle { fill:none; stroke-width:10; }
  .ring .track { stroke:var(--line); }
  .ring .prog { stroke:var(--line); transition:stroke .5s; }

  /* water inside the ring */
  .pool { position:absolute; inset:12%; border-radius:50%; overflow:hidden; background:#f7fafe;
          -webkit-mask-image:-webkit-radial-gradient(white, black); transform:translateZ(0); }
  .water { position:absolute; left:0; right:0; bottom:0; height:100%;
           transform:translateY(calc(100% + 20px)); transition:transform 1.4s cubic-bezier(.45,.05,.25,1); }
  .wave { position:absolute; left:0; top:-10px; width:200%; height:calc(100% + 10px); }
  .wave svg { width:100%; height:20px; display:block; }
  .wave div { background:currentColor; height:calc(100% - 19px); margin-top:-1px; }
  .wave.back { color:var(--water2); animation:drift 5s linear infinite; top:-14px; }
  .wave.front { color:var(--water); opacity:.85; animation:drift 3.2s linear infinite reverse; }
  @keyframes drift { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  /* stream pouring in from the top while open */
  .stream { position:absolute; left:50%; top:-4%; width:4%; margin-left:-2%; height:0; border-radius:0 0 6px 6px;
            background:linear-gradient(var(--water2), var(--water)); opacity:0; transition:height .6s ease, opacity .4s; }
  .drops i { position:absolute; left:50%; top:0; width:5%; height:7%; margin-left:-2.5%; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
             background:var(--water); opacity:0; }
  #status.open .stream, #status.alarm .stream { height:var(--fall, 60%); opacity:.55; }
  #status.open .drops i, #status.alarm .drops i { animation:drop 1.1s ease-in infinite; }
  .drops i:nth-child(2) { animation-delay:.37s !important; left:44%; }
  .drops i:nth-child(3) { animation-delay:.74s !important; left:56%; }
  @keyframes drop { 0% { transform:translateY(0); opacity:0; } 15% { opacity:.9; } 100% { transform:translateY(calc(var(--ring) * .62)); opacity:0; } }

  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  #big { font-size:calc(var(--ring) * .15); font-weight:800; letter-spacing:1px; line-height:1.1; transition:color .5s;
         text-shadow:0 1px 0 rgba(255,255,255,.7), 0 0 14px rgba(255,255,255,.9); }
  /* alarm countdown: bell with a ring that fills up toward the alarm */
  #detail { margin-top:0; height:0; display:flex; align-items:center; justify-content:center; transition:height .5s ease, margin-top .5s ease; }
  #status.open #detail, #status.alarm #detail { height:52px; margin-top:16px; }
  .bell { position:relative; width:52px; height:52px; opacity:0; transform:scale(.6); transition:opacity .4s, transform .5s cubic-bezier(.3,1.5,.5,1); }
  #status.open .bell, #status.alarm .bell { opacity:1; transform:none; }
  .bell svg.bar { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .bell circle { fill:none; stroke-width:4; }
  .bell .btrack { stroke:rgba(224,138,0,.18); }
  .bell .bfill { stroke:var(--warn); stroke-linecap:round; transition:stroke-dashoffset .9s linear, stroke .4s; }
  .bell svg.icon { position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; color:var(--warn); transition:color .4s; }
  #status.alarm .bell .btrack { stroke:rgba(224,65,58,.18); }
  #status.alarm .bell .bfill { stroke:var(--bad); }
  #status.alarm .bell svg.icon { color:var(--bad); animation:ring 1s ease-in-out infinite; transform-origin:50% 15%; }
  @keyframes ring { 0%,50%,100% { transform:rotate(0); } 10% { transform:rotate(16deg); } 20% { transform:rotate(-14deg); }
                    30% { transform:rotate(10deg); } 40% { transform:rotate(-6deg); } }

  /* transitions */
  .burst { position:absolute; inset:0; border-radius:50%; border:3px solid currentColor; opacity:0; pointer-events:none; }
  #status.to-open .burst { color:var(--warn); animation:burst 1s ease-out; }
  #status.to-closed .burst { color:var(--ok); animation:burst 1s ease-out; }
  @keyframes burst { 0% { transform:scale(.85); opacity:.8; } 100% { transform:scale(1.25); opacity:0; } }
  #status.to-open #big { animation:shake .6s ease; }
  @keyframes shake { 0%,100% { transform:none; } 20% { transform:translateX(-6px) rotate(-3deg); } 40% { transform:translateX(5px) rotate(2deg); }
                     60% { transform:translateX(-3px); } 80% { transform:translateX(2px); } }
  .check { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .check path { fill:none; stroke:var(--ok); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
                stroke-dasharray:60; stroke-dashoffset:60; opacity:0; }
  /* closing: checkmark draws, then fades, then CLOSED pops in */
  #status.to-closed .check path { animation:draw 1.1s ease forwards; }
  @keyframes draw { 0% { stroke-dashoffset:60; opacity:1; } 45% { stroke-dashoffset:0; opacity:1; } 70% { stroke-dashoffset:0; opacity:1; } 90%,100% { stroke-dashoffset:0; opacity:0; } }
  #status.to-closed .center > * { animation:popIn .5s .95s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes popIn { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:none; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  .bell { cursor:pointer; border:0; padding:0; background:none; }
  #status.closed .bell { pointer-events:none; }
  /* popup with how long it's been open */
  .modal { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:24px;
           background:rgba(22,32,46,.28); opacity:0; pointer-events:none; transition:opacity .25s;
           -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .modal.show { opacity:1; pointer-events:auto; }
  .sheet { background:var(--card); border-radius:22px; box-shadow:0 20px 50px rgba(22,32,46,.2); width:100%; max-width:320px;
           padding:24px 22px 18px; text-align:center; transform:translateY(12px) scale(.96); transition:transform .3s cubic-bezier(.3,1.4,.5,1); }
  .modal.show .sheet { transform:none; }
  .sheet .label { color:var(--muted); font-size:14px; }
  .sheet .big { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; margin:2px 0 14px; }
  .sheet .row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:15px; }
  .sheet .row span:first-child { color:var(--muted); }
  .sheet .row span:last-child { font-weight:600; font-variant-numeric:tabular-nums; }
  .sheet button { width:100%; margin-top:14px; padding:11px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---- history ---- */
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); animation:fadeUp .35s both; }
  li:last-child { border-bottom:0; }
  .ev { width:32px; height:32px; border-radius:10px; flex:none; display:grid; place-items:center; font-size:15px; font-weight:700; }
  .ev.opened { background:var(--warn-soft); color:var(--warn); }
  .ev.closed { background:var(--ok-soft); color:var(--ok); }
  .ev.alarm { background:var(--bad-soft); color:var(--bad); }
  .ev.started { background:#eef2f8; color:var(--muted); }
  .what { flex:1; min-width:0; }
  .what b { font-weight:600; font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .what small { color:var(--muted); font-size:13px; }
  .when { color:var(--muted); font-size:13px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .empty { color:var(--faint); justify-content:center; }
  .pager { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:8px; }
  .pager span { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:12px; border:0; background:#eef2f8; color:var(--fg); cursor:pointer; transition:transform .1s; }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.35; cursor:default; transform:none; }
  .pager[hidden], .card[hidden] { display:none; }
</style>
</head>
<body>
<main>
  <section class="card" id="status">
    <span class="offline" id="offline" role="status" title="No connection" aria-label="No connection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/><path d="M3 3l18 18"/></svg></span>
    <div class="ring">
      <div class="pool">
        <div class="water" id="water">
          <div class="wave back"><svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10 V20 H0Z" fill="currentColor"/></svg><div></div></div>
          <div class="wave front"><svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q25 20 50 10 T100 10 T150 10 T200 10 V20 H0Z" fill="currentColor"/></svg><div></div></div>
        </div>
        <div class="stream" id="stream"></div>
        <div class="drops"><i></i><i></i><i></i></div>
      </div>
      <svg class="arc" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="55"/><circle class="prog" id="prog" cx="60" cy="60" r="55"/></svg>
      <svg class="check" viewBox="0 0 120 120"><path d="M42 61 l12 12 l25 -27"/></svg>
      <div class="burst"></div>
      <div class="center"><div id="big"></div></div>
    </div>
    <div id="detail">
      <button class="bell" id="bell" aria-label="How long it's been open">
        <svg class="bar" viewBox="0 0 52 52"><circle class="btrack" cx="26" cy="26" r="23"/><circle class="bfill" id="bfill" cx="26" cy="26" r="23"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a1.5 1.5 0 0 0-1.5 1.5v.6A6.5 6.5 0 0 0 5.5 10.5V15l-1.6 2.2A1 1 0 0 0 4.7 19h14.6a1 1 0 0 0 .8-1.8L18.5 15v-4.5a6.5 6.5 0 0 0-5-6.4v-.6A1.5 1.5 0 0 0 12 2Zm-2.5 18a2.5 2.5 0 0 0 5 0h-5Z"/></svg>
      </button>
    </div>
  </section>

  <section class="card" id="histCard" hidden>
    <ul id="hist"></ul>
    <div class="pager" id="pager" hidden><button id="prev">← Newer</button><span id="pageNo"></span><button id="next">Older →</button></div>
  </section>
</main>
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="label">Open for</div>
    <div class="big" id="mOpen"></div>
    <div class="row"><span>Opened at</span><span id="mAt"></span></div>
    <div class="row"><span id="mAlarmLabel">Alarm in</span><span id="mAlarm"></span></div>
    <button id="mClose">Done</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const POLL = 1000, STALE = 2.5 * POLL, PER = 10;
const BC = 2 * Math.PI * 23;
$('bfill').style.strokeDasharray = BC;
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h} h ${m} min` : m ? `${m} min${x ? ` ${x} s` : ''}` : `${x} s`; };
const clock = t => { const d = new Date(t*1000), today = new Date().toDateString() === d.toDateString();
  return (today ? 'Today' : d.toLocaleDateString([], {month:'short', day:'numeric'})) + ', ' +
    d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
const EV = { opened:['Opened','↑'], closed:['Closed','✓'], alarm:['Alarm sounded','!'], started:['Monitoring started','•'] };

// ?demo flips open/closed every few seconds with fake data, to preview the animations
const DEMO = new URLSearchParams(location.search).has('demo');
let demo = { open:false, since:Date.now()/1000, delay:6, events:[] };
function demoState() {
  const now = Date.now()/1000;
  if (now - demo.since > (demo.open ? 9 : 5)) {
    demo.events.unshift({t:now, event: demo.open ? 'closed' : 'opened', open_for: demo.open ? Math.round(now - demo.since) : null});
    demo.open = !demo.open; demo.since = now;
  }
  const el = now - demo.since;
  return { open:demo.open, since:demo.since, now, alarm_delay:demo.delay, alarming: demo.open && el >= demo.delay, latest:demo.events.length };
}

let lastOk = 0, page = 1, latest = null, prev = null, fxTimer;

async function getEvents() {
  if (!DEMO) return (await fetch(`/api/events?page=${page}&per=${PER}`, {cache:'no-store'})).json();
  const total = demo.events.length, pages = Math.max(1, Math.ceil(total / PER));
  return { events: demo.events.slice((page-1)*PER, page*PER), page, pages, total };
}
async function loadPage() {
  const d = await getEvents();
  if (page > d.pages) { page = d.pages; return loadPage(); }
  $('hist').innerHTML = d.events.map(h => { const [name, sym] = EV[h.event] || [h.event, '•'];
    return `<li><span class="ev ${h.event}">${sym}</span><span class="what"><b>${name}</b>` +
      (h.open_for != null ? `<small>Was open ${dur(h.open_for)}</small>` : '') +
      `</span><span class="when">${clock(h.t)}</span></li>`; }).join('') || '<li class="empty">No events yet</li>';
  $('histCard').hidden = false;
  $('pager').hidden = d.pages <= 1;
  $('pageNo').textContent = `${d.page} / ${d.pages}`;
  $('prev').disabled = d.page <= 1; $('next').disabled = d.page >= d.pages;
}
$('prev').onclick = () => { page = Math.max(1, page - 1); loadPage(); };
$('next').onclick = () => { page++; loadPage(); };

let cur = null;
function fillModal() {
  if (!cur) return;
  if (!cur.open) { $('modal').classList.remove('show'); return; }
  const el = cur.now - cur.since;
  $('mOpen').textContent = dur(el);
  $('mAt').textContent = new Date(cur.since * 1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $('mAlarmLabel').textContent = cur.alarming ? 'Alarm' : 'Alarm in';
  const at = new Date((cur.since + cur.alarm_delay) * 1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $('mAlarm').textContent = cur.alarming ? `Sounding since ${at}` : `${dur(cur.alarm_delay - el)} (${at})`;
  $('mAlarm').style.color = cur.alarming ? 'var(--bad)' : '';
}
$('bell').onclick = () => { fillModal(); $('modal').classList.add('show'); };
$('mClose').onclick = () => $('modal').classList.remove('show');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('show'); };
addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('show'); });

function render(s) {
  cur = s;
  const el = s.now - s.since, open = s.open, mode = s.alarming ? 'alarm' : open ? 'open' : 'closed';
  const st = $('status');
  // transition effects only on a real change, not on first load
  if (prev !== null && prev !== open) {
    st.classList.remove('to-open', 'to-closed'); void st.offsetWidth;   // restart the animations
    st.classList.add(open ? 'to-open' : 'to-closed');
    clearTimeout(fxTimer); fxTimer = setTimeout(() => st.classList.remove('to-open', 'to-closed'), 1600);
  }
  prev = open;
  st.classList.remove('open', 'alarm', 'closed'); st.classList.add(mode);
  const color = { alarm:'var(--bad)', open:'var(--warn)', closed:'var(--ok)' }[mode];
  $('big').textContent = open ? 'OPEN' : 'CLOSED';   // red + ringing bell already say it's alarming
  $('big').style.color = color;
  $('prog').style.stroke = color;
  const frac = open ? Math.min(1, el / s.alarm_delay) : 0;
  $('bfill').style.strokeDashoffset = BC * (1 - frac);
  if ($('modal').classList.contains('show')) fillModal();
  // water fills while open, drains when closed
  const level = open ? 0.36 : 0;   // waterline sits just under the OPEN text
  $('water').style.transform = open ? `translateY(${(1 - level) * 100}%)` : 'translateY(calc(100% + 20px))';
  $('stream').style.setProperty('--fall', `${Math.max(8, (1 - level) * 100 + 2)}%`);
  document.title = { alarm:'ALARM', open:'Open', closed:'Closed' }[mode] + ' · Bidet Alarm';
  if (s.latest !== latest) { latest = s.latest; loadPage(); }
}

async function tick() {
  try {
    const s = DEMO ? demoState() : await (await fetch('/api/state', {cache:'no-store'})).json();
    lastOk = Date.now();
    render(s);
  } catch (e) { /* the dot turns red */ }
}
function health() {
  const live = Date.now() - lastOk < STALE;
  $('offline').classList.toggle('show', !live && Date.now() - started > STALE);
}
const started = Date.now();
tick(); setInterval(tick, POLL); setInterval(health, 500);
</script>
</body>
</html>
